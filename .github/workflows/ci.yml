name: Development foundation
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"
          python-version: "3.12"
      - run: uv sync --all-packages --frozen
      - run: uv run --all-packages --frozen pytest
      - run: uv run --all-packages --frozen python scripts/export_contracts.py --check

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -f services/api/pom.xml verify

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"
          python-version: "3.12"
      - run: python3 scripts/bootstrap.py
      - run: docker compose config --quiet
      - run: docker compose --profile queue up --build --wait --wait-timeout 240
      - run: uv sync --all-packages --frozen
      - run: uv run --all-packages --frozen --env-file .env python scripts/smoke.py --include-queue
      - run: docker compose exec -T redis-cache redis-cli ping
      - run: docker compose --profile queue exec -T rabbitmq rabbitmq-diagnostics -q check_running
      - if: always()
        run: docker compose --profile queue logs --tail=100
      - if: always()
        run: docker compose --profile queue down
