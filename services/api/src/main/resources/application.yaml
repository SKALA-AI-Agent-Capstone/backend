server:
  port: 8080
spring:
  application:
    name: beauty-api
  datasource:
    url: ${APP_DB_JDBC_URL:jdbc:postgresql://127.0.0.1:55432/beauty_capstone}
    username: app_user
    password: ${APP_DB_PASSWORD}
    hikari:
      schema: app
      connection-timeout: 3000
      maximum-pool-size: 5
  flyway:
    enabled: true
    schemas: app
    default-schema: app
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
capstone:
  internal-token: ${INTERNAL_SERVICE_TOKEN}
  agent-base-url: ${AGENT_BASE_URL:http://127.0.0.1:8001}
