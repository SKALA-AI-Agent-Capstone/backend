server:
  port: 8080
spring:
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 76MB
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:56379}
      password: ${REDIS_PASSWORD}
      timeout: 3s
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:capstone}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:capstone}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        prefetch: 1
  application:
    name: beauty-api
  datasource:
    url: ${APP_DB_JDBC_URL:jdbc:postgresql://127.0.0.1:55432/beauty_capstone}
    username: app_user
    password: ${APP_DB_PASSWORD}
    hikari:
      schema: app
      connection-timeout: 3000
      maximum-pool-size: 5
  flyway:
    enabled: true
    schemas: app
    default-schema: app
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
capstone:
  jwt-secret: ${JWT_SECRET}
  jwt:
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P14D}
    # 이미 회전된 Refresh Token이 이 시간 안에 다시 오면 탭 간 동시 재발급으로 보고 세션을 폐기하지 않는다.
    refresh-reuse-grace: ${JWT_REFRESH_REUSE_GRACE:PT30S}
    refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:true}
  internal-token: ${INTERNAL_SERVICE_TOKEN}
  agent-base-url: ${AGENT_BASE_URL:http://127.0.0.1:8001}
  # 참조 기준 화면의 적재 현황. rag-mcp가 문서 버전 목록만 돌려준다.
  rag-corpus-url: ${RAG_CORPUS_URL:http://127.0.0.1:8003/health/corpus}
  review:
    queue-enabled: ${REVIEW_QUEUE_ENABLED:false}
    # 문구 하나에 사람이 요청할 수 있는 다시쓰기 횟수(M). violation_rewrites.requested_by_human 행 수로 센다.
    human-rewrite-limit: ${HUMAN_REWRITE_LIMIT:3}

payments:
  return-url: ${PAYMENT_RETURN_URL:http://127.0.0.1:5173/credits}
  toss-client-key: ${TOSS_TEST_CLIENT_KEY:}
  toss-secret-key: ${TOSS_TEST_SECRET_KEY:}
